<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produk - Jaya Teknik</title>

<style>
body{font-family:Poppins,sans-serif;background:#f5f7fa;margin:0}
header{background:#004aad;color:#fff;padding:1.5rem;text-align:center;position:relative}
.cart-icon{position:absolute;right:20px;top:20px;cursor:pointer}
.cart-icon span{background:white;color:#004aad;border-radius:50%;padding:2px 8px;font-weight:bold}
.product-container{max-width:1100px;margin:2rem auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.5rem}
.card{background:#fff;border-radius:10px;padding:1rem;box-shadow:0 5px 15px rgba(0,0,0,.1)}
.card img{width:100%;height:180px;object-fit:cover;border-radius:8px}
.btn{display:block;margin-top:10px;padding:.6rem;border-radius:8px;text-align:center;background:#0078ff;color:white;text-decoration:none;font-weight:600}
</style>
</head>

<body>

<header>
<h1>Jaya Teknik</h1>
<div class="cart-icon" onclick="location.href='cart.html'">
🛒 <span id="cartCount">0</span>
</div>
</header>

<div class="product-container">

<div class="card">
<img src="https://images.tokopedia.net/img/cache/500-square/VqbcmM/2022/12/30/aebaea0d-a199-4348-9090-4cdf7dbaf14f.jpg">
<h3>Vanbelt A-62</h3>
<p>Rp. 55.000</p>
<a href="#" class="btn add"
data-name="Vanbelt A-62"
data-price="55000"
data-img="https://images.tokopedia.net/img/cache/500-square/VqbcmM/2022/12/30/aebaea0d-a199-4348-9090-4cdf7dbaf14f.jpg">
Pesan Sekarang</a>
</div>

<div class="card">
<img src="https://5.imimg.com/data5/SELLER/Default/2022/1/DP/GM/YK/56855744/skf-6203-2rsh-ball-bearing-500x500.jpg">
<h3>Bearing 6203 SKF</h3>
<p>Rp. 75.000</p>
<a href="#" class="btn add"
data-name="Bearing 6203 SKF"
data-price="75000"
data-img="https://5.imimg.com/data5/SELLER/Default/2022/1/DP/GM/YK/56855744/skf-6203-2rsh-ball-bearing-500x500.jpg">
Pesan Sekarang</a>
</div>

</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];
const cartCount = document.getElementById("cartCount");

function updateCart(){
  cartCount.innerText = cart.reduce((a,b)=>a+b.qty,0);
  localStorage.setItem("cart",JSON.stringify(cart));
}
updateCart();

document.querySelectorAll(".add").forEach(btn=>{
  btn.onclick = e =>{
    e.preventDefault();
    const name = btn.dataset.name;
    const price = Number(btn.dataset.price);
    const image = btn.dataset.img;

    const item = cart.find(i=>i.name===name);
    if(item) item.qty++;
    else cart.push({name,price,image,qty:1});

    updateCart();
    alert("Produk masuk keranjang 🛒");
  }
});
</script>

</body>
</html>
